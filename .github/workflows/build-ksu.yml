name: Build Xperia 10 KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev lld lz4 python3 unzip zip

      - name: Download Modern Clang Toolchain
        run: |
          mkdir -p toolchains/clang
          CLANG_URL=$(curl -sL https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt | tr -d '\r\n')
          curl -fL "$CLANG_URL" -o clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang
          rm -f clang.tar.gz

      - name: Integrate KernelSU Next (Legacy) and Manual Syscall Hooks
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          grep -n "ksu_handle_sys_reboot" kernel/reboot.c

      - name: Configure and Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          CLANG_BIN=$(dirname "$(find "$PWD/toolchains/clang" -name "ld.lld" | head -n 1)")
          export PATH="$CLANG_BIN:$PATH"

          make O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/sdm660-perf_defconfig \
            vendor/sony/common.config \
            vendor/sony/kirin.config

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KSU_KPROBES_HOOK \
            -d CONFIG_KPROBES

          yes "" | make O=out LLVM=1 LLVM_IAS=1 olddefconfig

          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KSU_KPROBES_HOOK \
            -d CONFIG_KPROBES

          make -j$(nproc) O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            CONFIG_KSU=y \
            CONFIG_KSU_MANUAL_HOOK=y \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package into AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../Xperia10-kirin-KSUNext.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Xperia10-kirin-KSUNext
          path: Xperia10-kirin-KSUNext.zip
