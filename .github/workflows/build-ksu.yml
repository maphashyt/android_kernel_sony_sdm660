name: Build Xperia 10 KernelSU-Next (UAPI 5)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev liblz4-tool libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
            xsltproc zip zlib1g-dev python3 python-is-python3 clang lld llvm binutils-aarch64-linux-gnu

      - name: Set up Clang Toolchain
        run: |
          mkdir -p "$HOME/clang"
          CLANG_URL=$(curl -sL https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep -o 'https://[^"]*Clang-[^"]*\.tar\.gz' | head -n 1)
          if [ -n "$CLANG_URL" ]; then
            curl -fL "$CLANG_URL" -o clang.tar.gz
            tar -xzf clang.tar.gz -C "$HOME/clang"
          fi

      - name: Integrate KernelSU-Next (UAPI 5 - 465490a2)
        run: |
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout 465490a2
          cd ..
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Configure and Compile Image.gz-dtb
        run: |
          if [ -x "$HOME/clang/bin/clang" ]; then
            export PATH="$HOME/clang/bin:$PATH"
          fi
          cd arch/arm64/configs
          echo "=== Available kirin/sony/sdm660 configs ==="
          find . -maxdepth 3 \( -iname "*kirin*" -o -iname "*nile*" -o -iname "*sdm660*" \)
          BASE_DEF=$(find . -maxdepth 3 -name "*kirin*defconfig" | sed 's|^\./||' | head -n 1)
          if [ -z "$BASE_DEF" ]; then
            BASE_DEF=$(find . -maxdepth 3 \( -name "sdm660-perf_defconfig" -o -name "sdm660_defconfig" -o -name "*nile*defconfig" \) | sed 's|^\./||' | head -n 1)
          fi
          NILE_FRAG=$(find . -maxdepth 3 -name "*nile*.config" | sed 's|^\./||' | head -n 1)
          KIRIN_FRAG=$(find . -maxdepth 3 -name "*kirin*.config" | sed 's|^\./||' | head -n 1)
          cd ../../..
          echo "Using BASE_DEF=$BASE_DEF NILE_FRAG=$NILE_FRAG KIRIN_FRAG=$KIRIN_FRAG"
          make O=out ARCH=arm64 $BASE_DEF $NILE_FRAG $KIRIN_FRAG
          ./scripts/config --file out/.config -e KSU
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb

      - name: Package Artifacts
        run: |
          mkdir -p release_out
          cp out/arch/arm64/boot/Image.gz-dtb release_out/
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../release_out/Xperia10-kirin-KSUNext.zip ./*

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xperia10-kirin-KSUNext-UAPI5
          path: release_out/*
