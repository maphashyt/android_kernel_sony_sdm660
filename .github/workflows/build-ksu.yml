name: Build Xperia 10 KernelSU-Next (UAPI 5)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev liblz4-tool libssl-dev libxml2-utils lzop pngcrush rsync schedtool \
            xsltproc zip zlib1g-dev python3 python-is-python3 lld llvm \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone Official LineageOS Clang Toolchain
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r487747c.git "$HOME/clang"

      - name: Integrate KernelSU-Next (UAPI 5 - 465490a2)
        run: |
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next
          git checkout 465490a2
          cd ..
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Configure and Compile Image.gz-dtb
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          which clang
          which ld.lld
          clang --version

          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          make $MAKE_ARGS vendor/sdm660-perf_defconfig vendor/sony/kirin.config
          ./scripts/config --file out/.config -e KSU
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error" Image.gz-dtb

      - name: Package Artifacts
        run: |
          mkdir -p release_out
          cp out/arch/arm64/boot/Image.gz-dtb release_out/
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../release_out/Xperia10-kirin-KSUNext.zip ./*

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xperia10-kirin-KSUNext-UAPI5
          path: release_out/*
