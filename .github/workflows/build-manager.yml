name: Build Legacy Manager APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone KernelSU-Next (v3.4.2)
        run: |
          git clone -b v3.4.2 https://github.com/KernelSU-Next/KernelSU-Next.git ksunext

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract prebuilt ksud from v3.4.2 Release APK
        run: |
          APK_URL=$(curl -sL https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/tags/v3.4.2 | grep -o 'https://[^"]*\.apk' | head -n 1)
          curl -fL "$APK_URL" -o release.apk
          mkdir -p ksunext/manager/app/src/main/jniLibs/arm64-v8a
          unzip -p release.apk lib/arm64-v8a/libksud.so > ksunext/manager/app/src/main/jniLibs/arm64-v8a/libksud.so

      - name: Bump Manager Version Suffix to -6 and Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cd ksunext/manager
          sed -i 's/"-5"/"-6"/g' app/build.gradle.kts
          find app/src/main/java -type f -name "*.kt" -exec sed -i -E 's/(MINIMAL_SUPPORTED_KERNEL[^0-9]*)5/\16/g; s/(managerVersion[^0-9]*)5/\16/g' {} +
          chmod +x gradlew
          ./gradlew assembleDebug -x lint

      - name: Upload Legacy Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KSUNext-Legacy-Manager
          path: ksunext/manager/app/build/outputs/apk/debug/*.apk
