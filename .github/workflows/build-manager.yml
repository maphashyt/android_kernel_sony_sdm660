name: Build Legacy Manager APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone KernelSU-Next (legacy branch)
        run: |
          git clone --depth 1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git ksunext

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk

      - name: Build Legacy Manager APK
        run: |
          export ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          cd ksunext
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew :manager:assembleDebug
          elif [ -f "manager/gradlew" ]; then
            cd manager
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            find . -maxdepth 3 -name "gradlew"
            exit 1
          fi

      - name: Upload Legacy Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KSUNext-Legacy-Manager
          path: ksunext/**/build/outputs/apk/**/*.apk
