name: Build Legacy Manager APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone KernelSU-Next (v3.4.2)
        run: |
          git clone --depth 1 -b v3.4.2 https://github.com/KernelSU-Next/KernelSU-Next.git ksunext

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build arm64 ksud daemon
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          export ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          if [ -d "ksunext/userspace/ksud" ]; then
            cd ksunext/userspace/ksud
          else
            cd ksunext/ksud
          fi
          cargo ndk -t arm64-v8a -o "$GITHUB_WORKSPACE/ksunext/manager/app/src/main/jniLibs" build --release

      - name: Bump Manager UAPI to 6 and Build APK
        run: |
          cd ksunext/manager
          find . -type f \( -name "*.kts" -o -name "*.kt" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i -E 's/([Uu][Aa][Pp][Ii][^0-9]*)5/\16/g' {} +
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Legacy Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KSUNext-Legacy-Manager
          path: ksunext/manager/app/build/outputs/apk/debug/*.apk
